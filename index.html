<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="houseplay-loader" content="safari-safe-v5-2026-08-06">
<title>HousePlay</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0b;color:#f5f2f2;font-family:system-ui,-apple-system,sans-serif;padding:24px}main{width:min(100%,440px);padding:28px;border:1px solid #303036;border-radius:24px;background:#141416;text-align:center}.logo{font-size:42px}h1{margin:10px 0 6px}p{color:#aaa4a6;line-height:1.5}#error{display:none;color:#ff9b9f;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="logo">♥</div>
<h1>HousePlay</h1>
<p id="status">Loading the complete game…</p>
<p id="error"></p>
</main>
<script>
(async()=>{
  const files=[
    "chunk-01-a.txt","chunk-01-b0.txt","chunk-01-b1.txt","chunk-01-b2.txt","chunk-01-c.txt",
    "chunk-02.txt","chunk-03.txt","chunk-04.txt","chunk-05.txt",
    "chunk-06.txt","chunk-07.txt","chunk-08.txt"
  ];

  function showError(error){
    const status=document.getElementById("status");
    const box=document.getElementById("error");
    if(status)status.textContent="HousePlay could not finish loading.";
    if(box){box.style.display="block";box.textContent="Reload this page. Error: "+(error&&error.message?error.message:String(error));}
  }

  try{
    const parts=[];
    for(const name of files){
      const url=new URL("houseplay-v4/"+name,location.href);
      url.searchParams.set("build","safari-safe-v5-20260806");
      const response=await fetch(url.href,{cache:"no-store"});
      if(!response.ok)throw new Error(name+" returned "+response.status);
      parts.push((await response.text()).trim());
    }

    const encoded=parts.join("").replace(/\s/g,"");
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const html=new TextDecoder("utf-8").decode(bytes);

    if(!html.includes('name="houseplay-build" content="full-v4-2026-08-06"')){
      throw new Error("Build verification failed");
    }

    const parsed=new DOMParser().parseFromString(html,"text/html");
    const scripts=[...parsed.querySelectorAll("script")].map(script=>({
      src:script.getAttribute("src"),
      type:script.getAttribute("type"),
      text:script.textContent||""
    }));
    parsed.querySelectorAll("script").forEach(script=>script.remove());

    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;

    for(const definition of scripts){
      await new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        if(definition.type)script.type=definition.type;
        if(definition.src){
          script.src=new URL(definition.src,location.href).href;
          script.onload=resolve;
          script.onerror=()=>reject(new Error("A required script did not load"));
          document.body.appendChild(script);
        }else{
          script.textContent=definition.text;
          document.body.appendChild(script);
          resolve();
        }
      });
    }
  }catch(error){
    console.error("HousePlay loader error",error);
    showError(error);
  }
})();
</script>
</body>
</html>
