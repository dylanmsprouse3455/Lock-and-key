<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="houseplay-loader" content="full-v4-2026-08-06">
<title>HousePlay</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0b;color:#f5f2f2;font-family:system-ui,-apple-system,sans-serif;padding:24px}main{width:min(100%,440px);padding:28px;border:1px solid #303036;border-radius:24px;background:#141416;text-align:center}.logo{font-size:42px}h1{margin:10px 0 6px}p{color:#aaa4a6;line-height:1.5}#error{display:none;color:#ff9b9f}
</style>
</head>
<body>
<main>
<div class="logo">♥</div>
<h1>HousePlay</h1>
<p id="status">Loading the complete game…</p>
<p id="error"></p>
</main>
<script>
(async()=>{
  const files=[
    "chunk-01-a.txt","chunk-01-b0.txt","chunk-01-b1.txt","chunk-01-b2.txt","chunk-01-c.txt",
    "chunk-02.txt","chunk-03.txt","chunk-04.txt","chunk-05.txt",
    "chunk-06.txt","chunk-07.txt","chunk-08.txt"
  ];
  try{
    const parts=await Promise.all(files.map(async name=>{
      const response=await fetch("houseplay-v4/"+name+"?build=full-v4-20260806",{cache:"no-store"});
      if(!response.ok)throw new Error(name+" returned "+response.status);
      return (await response.text()).trim();
    }));
    const encoded=parts.join("").replace(/\s/g,"");
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
    const html=new TextDecoder("utf-8").decode(bytes);
    if(!html.includes('name="houseplay-build" content="full-v4-2026-08-06"')){
      throw new Error("Build verification failed");
    }
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById("status").textContent="HousePlay could not finish loading.";
    const box=document.getElementById("error");
    box.style.display="block";
    box.textContent="Reload this page. Error: "+error.message;
  }
})();
</script>
</body>
</html>
